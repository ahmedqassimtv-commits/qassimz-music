<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#543411"/>
      <stop offset="55%" stop-color="#3C260F"/>
      <stop offset="100%" stop-color="#2F230E"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7B22F"/>
      <stop offset="100%" stop-color="#EF950A"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8BC40"/>
      <stop offset="48%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

