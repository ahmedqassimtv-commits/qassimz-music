      <line x1="664" y1="24" x2="664" y2="1000" stroke="#FDE68A" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="664" x2="1000" y2="664" stroke="#FDE68A" stroke-opacity="0.045" stroke-width="2"/>
