<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QASSIMZ Music</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body tabindex="-1">
<div class="bg"><div class="art" id="bgArt"></div></div>

<div class="app">
  <aside class="side glass">
    <div class="brand pywebview-drag-region" title="اسحب لتحريك النافذة">
      <img src="logo.svg" alt="QASSIMZ Music" onerror="this.onerror=null;this.src='logo.png'">
      <div class="brand-txt">
        <b>قَاسِمز</b>
        <small>MUSIC STUDIO</small>
      </div>
    </div>
    <div class="side-label">التصفّح</div>
    <nav id="nav"></nav>
    <div class="side-sec"><span>قوايم التشغيل</span><button id="newPl" title="قايمة جديدة"></button></div>
    <div class="pl-list" id="plNav"></div>
    <div class="side-foot">
      <button class="btn sm" id="bSet" title="الإعدادات (Ctrl+,)"></button>
      <button class="btn sm" id="bGit" title="GitHub"></button>
      <button class="btn sm" id="bSup" title="الدعم"></button>
    </div>
  </aside>

  <div class="stage">
    <header class="topbar glass pywebview-drag-region" id="appTopbar">
      <div class="top-start no-drag">
        <button class="ib top-back" id="topBack" title="رجوع (Backspace)" aria-label="رجوع">
          <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <div class="top-search-wrap">
          <svg class="i top-search-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" class="top-search" id="topSearch" placeholder="ابحث عن محطة راديو، أغنية، فنان…" autocomplete="off">
          <kbd class="top-kbd">Ctrl+K</kbd>
        </div>
      </div>
      <div class="top-end no-drag">
        <span class="top-pill" id="topPageTitle">الرئيسية</span>
        <span class="win-sep"></span>
        <div class="win-controls">
          <button class="win-btn" id="winMin" type="button" title="تصغير" aria-label="تصغير">
            <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="win-btn" id="winMax" type="button" title="تكبير / استعادة" aria-label="تكبير">
            <svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <button class="win-btn win-close" id="winClose" type="button" title="إغلاق" aria-label="إغلاق">
            <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <footer class="player glass" id="player">
    <div class="np">
      <div class="cover" id="pCover" title="شاشة التشغيل الكاملة (F)"><span class="ini">♪</span></div>
      <div class="meta">
        <b id="pTitle">اختار حاجة تسمعها</b>
        <small id="pSub">راديو مباشر، مهرجانات، شعبي، طرب، وعالمي…</small>
      </div>
      <button class="ib" id="pFav" title="المفضلة"></button>
    </div>
    <div class="ctrl">
      <div class="btns">
        <button class="ib" id="pShuffle" title="عشوائي (S)"></button>
        <button class="ib" id="pPrev" title="السابق (P)"></button>
        <button class="ib big" id="pPlay" title="تشغيل / إيقاف (Space)"></button>
        <button class="ib" id="pNext" title="التالي (N)"></button>
        <button class="ib" id="pRepeat" title="تكرار (R)"></button>
      </div>
      <div class="prog">
        <span id="pCur">0:00</span>
        <div class="bar" id="pBar"><i id="pFill" style="width:0"></i></div>
        <span id="pDur">0:00</span>
      </div>
    </div>
    <div class="side-ctrl">
      <canvas class="mini-vis" id="miniVis" width="160" height="68"></canvas>
      <span class="sleep-badge" id="sleepBadge"></span>
      <button class="ib" id="pSleep" title="مؤقت النوم"></button>
      <button class="ib" id="pEq" title="الإكولايزر (E)"></button>
      <button class="ib" id="pQueue" title="قايمة الانتظار (Q)"></button>
      <div class="vol">
        <button class="ib" id="pMute" title="كتم الصوت (M)"></button>
        <input type="range" id="pVol" min="0" max="1" step="0.01" value="0.8">
      </div>
      <button class="ib" id="pFull" title="شاشة التشغيل الكاملة (F)"></button>
    </div>
  </footer>
</div>

<audio id="audio" preload="none"></audio>
<div id="layer"></div>
<script src="app.js"></script>
</body>
</html>
